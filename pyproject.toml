[project]
name = "aquaclean"
version = "0.1.0"
description = "Aqua Clean: demo local sintética de operaciones supervisadas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3", "uvicorn[standard]==0.54.0", "pydantic-settings==2.16.0", "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.1", "langchain==1.4.6", "langchain-google-genai==4.4.2", "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0", "google-genai==2.31.0", "python-multipart==0.0.32",
  "pillow==13.0.0", "pypdf==6.21.0", "mutagen==1.48.1", "httpx==0.28.1", "typer==0.27.3",
]

[dependency-groups]
dev = ["ruff==0.17.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "mypy==2.4.0", "types-Pillow==10.2.0.20240822"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquaclean"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/aquaclean/interfaces/api/app.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_provider: llamadas facturables con Gemini configurado"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/aquaclean/domain", "src/aquaclean/agents/schemas.py", "src/aquaclean/config.py"]
